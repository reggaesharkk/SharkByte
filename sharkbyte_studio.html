<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SharkByte Studio</title>
<style>
:root{color-scheme:dark;--bg:#101519;--panel:#191f24;--line:#343e45;--text:#edf1ec;--muted:#a7b4b6;--accent:#c9ef81}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Inter,system-ui,sans-serif}
header,main{max-width:1500px;margin:auto;padding:22px 4vw}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}h1{font-size:24px;margin:0}h1 span{color:var(--accent)}h2{font-size:16px;margin:0}.badge,label,small{color:var(--muted)}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}.panel{border:1px solid var(--line);border-radius:12px;background:var(--panel);min-width:0;overflow:hidden}.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}.bar h2{margin-right:auto}
button,select{font:inherit;background:#252e35;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:8px 11px}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}.primary{background:var(--accent);color:#16200c;font-weight:750}.view[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
textarea,pre{font:14px/1.6 'IBM Plex Mono',Consolas,monospace;tab-size:4}textarea{width:100%;min-height:430px;display:block;background:#11171b;color:var(--text);border:0;resize:vertical;padding:18px}pre{min-height:300px;max-height:570px;overflow:auto;padding:16px;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.foot{padding:12px 16px;border-top:1px solid var(--line)}#status{min-height:1.4em;color:var(--accent);overflow-wrap:anywhere}#status[data-error=true]{color:#ffad9f}
@media(max-width:860px){main{grid-template-columns:1fr}textarea{min-height:270px}}
</style>
<header><h1>SharkByte <span>Studio</span></h1><span class="badge">Local workspace</span></header>
<main>
  <section class="panel" aria-labelledby="sourceTitle">
    <div class="bar"><h2 id="sourceTitle">Source</h2><label for="mode">Mode</label>
      <select id="mode"><option value="classical">Classical</option><option value="quantum">Quantum</option><option value="hybrid">Bounded Hybrid (2–6 qubits)</option><option value="frontier">Frontier30 (sparse)</option><option value="scaling">Million-state benchmark</option></select>
      <button id="example" disabled>Load example</button><button id="run" class="primary" disabled>Run</button></div>
    <div class="bar" id="sparseOptions" hidden style="display:none"><label for="supportCap">Sparse state cap</label>
      <select id="supportCap"><option value="4096">4,096</option><option value="8192">8,192</option><option value="16384">16,384</option><option value="32768">32,768</option><option value="65536">65,536</option><option value="131072">131,072</option></select></div>
    <textarea id="source" aria-label="SharkByte source" spellcheck="false"></textarea>
    <div class="foot"><small>Ctrl / ⌘ + Enter to run · SharkVM and CPU simulation</small></div>
  </section>
  <section class="panel" aria-labelledby="resultsTitle">
    <div class="bar"><h2 id="resultsTitle">Results</h2><button id="save" disabled>Save receipt</button></div>
    <div class="bar" aria-label="Result views">
      <button class="view" data-view="output" aria-pressed="true">Output</button>
      <button class="view" data-view="metrics" aria-pressed="false">Metrics</button>
      <button class="view" data-view="bytecode" aria-pressed="false">Bytecode</button>
      <button class="view" data-view="source" aria-pressed="false">Run source</button>
      <button class="view" data-view="receipt" aria-pressed="false">JSON</button>
    </div>
    <pre id="result">Run a program to see its output.</pre>
    <div class="foot" id="status" role="status"></div>
  </section>
</main>
<script>
'use strict';
const byId = id => document.getElementById(id);
const source = byId('source'), mode = byId('mode'), run = byId('run');
const save = byId('save'), status = byId('status'), output = byId('result');
const example = byId('example'), views = document.querySelectorAll('.view');
const format = value => JSON.stringify(value, null, 2);
let active = 'output', latest = null, examples = {}, busy = false;

function render() {
  if (!latest?.record) return;
  const {record, execution_id, worker_wall_seconds, disassembly} = latest;
  const {result, source_sha256, bytecode_sha256, record_sha256, toolchain_version} = record;
  const omitted = result.probability_entries ?? 0;
  const note = omitted ? `Showing 64 of ${omitted.toLocaleString()} probabilities. Save receipt for the full data.\n\n` : '';
  const panels = {
    output: result.stdout ?? note + format(result),
    metrics: format({execution_id, toolchain_version, worker_wall_seconds,
      vm_instruction_count:result.vm_instruction_count, vm_step_limit:result.vm_step_limit,
      qubits:result.qubits, support_cap:result.support_cap, peak_populated_states:result.peak_populated_states,
      source_sha256, bytecode_sha256, record_sha256}),
    bytecode: disassembly ? `${disassembly}\n\nEncoded bytes (hex${record.bytecode_preview ? ', preview' : ''})\n${record.bytecode_hex}` : 'This run did not emit a SharkVM bytecode artifact.',
    source: record.source,
    receipt: note + format(record),
  };
  output.textContent = panels[active];
}

function selectView(name) {
  active = name;
  for (const view of views) view.setAttribute('aria-pressed', String(view.dataset.view === name));
  render();
}

async function execute() {
  if (busy || run.disabled) return;
  busy = true;
  run.disabled = save.disabled = true;
  latest = null;
  status.dataset.error = 'false';
  status.textContent = 'Running…';
  output.textContent = '';
  selectView('output');
  try {
    const response = await fetch('/run', {method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({source:source.value,mode:mode.value,support_cap:Number(byId('supportCap').value)})});
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || `Request failed (${response.status})`);
    latest = data;
    status.textContent = `Completed · ${data.execution_id}`;
    save.disabled = false;
    render();
  } catch (error) {
    status.dataset.error = 'true';
    status.textContent = 'Run failed';
    output.textContent = error.message;
  } finally {
    busy = run.disabled = false;
  }
}

for (const button of views) button.addEventListener('click', () => selectView(button.dataset.view));
run.addEventListener('click', execute);
mode.addEventListener('change', () => {
  const options = byId('sparseOptions');
  options.hidden = mode.value !== 'frontier';
  options.style.display = options.hidden ? 'none' : '';
  source.readOnly = mode.value === 'scaling';
  if (source.readOnly && examples.scaling) source.value = examples.scaling;
});
source.addEventListener('keydown', event => {
  if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') { event.preventDefault(); execute(); }
});
example.addEventListener('click', () => {
  source.value = examples[mode.value];
  if (mode.value === 'frontier') byId('supportCap').value = '131072';
});
save.addEventListener('click', () => {
  const link = document.createElement('a');
  link.href = latest.receipt_url;
  link.download = `sharkbyte-${latest.execution_id}.json`;
  link.click();
});
run.disabled = false;
fetch('/examples').then(response => {
  if (!response.ok) throw new Error('Examples unavailable');
  return response.json();
}).then(data => {
  examples = data;
  example.disabled = false;
  if (!source.value) source.value = examples[mode.value];
}).catch(error => { status.textContent = error.message; });
</script>
</html>
