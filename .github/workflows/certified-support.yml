name: Certified bounded-support subset
on:
  pull_request:
    paths:
      - 'benchmarks/sb_quantum_benchmark/certified_support.py'
      - 'benchmarks/sb_quantum_benchmark/bounded_support.py'
      - 'tests/test_certified_support.py'
      - 'tools/high_support/check_certified_support.py'
      - 'tools/high_support/check_moving_branch_protection.py'
      - 'benchmarks/sb_quantum_benchmark/verify_bounded.py'
      - 'docs/certified-bounded-support.md'
      - 'docs/bounded-support.md'
      - 'docs/bounded-support-audit.md'
      - 'CLAIM_BOUNDARIES.md'
      - 'REPRODUCIBILITY.md'
      - 'README.md'
      - 'tools/high_support/check_platform_regressions.py'
      - 'requirements-high-support.txt'
      - 'tools/high_support/verify_gce_cross_platform_audit.py'
      - 'tests/test_gce_cross_platform_audit.py'
      - 'evidence/gce-moving-branch-cross-platform-20261120/**'
      - '.github/workflows/certified-support.yml'
  workflow_dispatch:
jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m unittest discover -s tests -p test_certified_support.py -v
      - run: python -m unittest tests.test_gce_cross_platform_audit -v
      - run: python -B tools/high_support/verify_gce_cross_platform_audit.py
      - run: python tools/high_support/check_moving_branch_protection.py > moving-branch-protection-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: moving-branch-protection-windows-x64-evidence
          path: moving-branch-protection-evidence.json
  exact-and-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-high-support.txt
      - run: python -m unittest discover -s tests -p test_certified_support.py -v
      - run: python -m unittest tests.test_gce_cross_platform_audit -v
      - run: python -B tools/high_support/verify_gce_cross_platform_audit.py
      - run: python tools/high_support/check_moving_branch_protection.py > moving-branch-protection-evidence.json
      - run: python tools/high_support/check_certified_support.py > certified-support-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: certified-support-reference-evidence
          path: |
            certified-support-evidence.json
            moving-branch-protection-evidence.json
