name: Hadamard mathematical foundations
on: [pull_request, workflow_dispatch]
jobs:
  foundations:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -m unittest tests.test_hadamard_foundations tests.test_h3 tests.test_h4_archived_h3
      - run: python -B -O -m unittest tests.test_hadamard_foundations tests.test_h3 tests.test_h4_archived_h3
      - run: python -B -OO -m unittest tests.test_hadamard_foundations tests.test_h3 tests.test_h4_archived_h3

      - run: python -B -m tools.high_support.h3_run evidence/h3/circuit.json h3-ci.json
      - run: python -B -OO -m tools.high_support.h3_run evidence/h3/circuit.json h3-ci.json --replay
      - uses: actions/upload-artifact@v4
        with:
          name: h3-${{ matrix.os }}
          path: h3-ci.json
