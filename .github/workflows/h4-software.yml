name: H4 deterministic software binary64
on: [pull_request, workflow_dispatch]
jobs:
  software-binary64:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -m unittest tests.test_h4_software tests.test_h4_gate2_compatibility
      - run: python -B -O -m unittest tests.test_h4_software tests.test_h4_gate2_compatibility
      - run: python -B -OO -m unittest tests.test_h4_software tests.test_h4_gate2_compatibility
      - run: python -B -m tools.high_support.h4_run evidence/h3/circuit.json h4-ci.json
      - run: python -B -OO -m tools.high_support.h4_run evidence/h3/circuit.json h4-ci.json --replay
      - run: python -B -m tools.high_support.h4_run evidence/h3/circuit.json evidence/h4-gate1/windows-arm64.json --replay
      - run: python -B -m tools.high_support.h4_run evidence/h3/circuit.json evidence/h4-gate1/ubuntu-wsl2-arm64.json --replay
      - uses: actions/upload-artifact@v4
        with:
          name: h4-${{ matrix.os }}
          path: h4-ci.json
