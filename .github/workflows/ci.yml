name: SharkByte CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  connected-statevector-reference:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install pinned independent references
        run: |
          python -m pip install -r requirements-independent-quantum.txt cirq-core==1.7.0
          python -m pip check

      - name: Verify historical connected-circuit evidence at its source revision
        shell: pwsh
        run: |
          $revision = '5b882fb430f00fcd15fd1fe32d5294883ba9dd13'
          git diff --exit-code $revision HEAD -- evidence/connected-circuit-frontier
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = Join-Path $env:RUNNER_TEMP 'connected-circuit-source.zip'
          $historical = Join-Path $env:RUNNER_TEMP 'connected-circuit-source'
          git archive --format=zip --output=$archive $revision
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m zipfile -e $archive $historical
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B (Join-Path $historical 'tools/verify_connected_circuit_evidence.py')

      - name: Verify the manual Studio receipt
        run: python -B tools/verify_studio_scaling_receipt.py evidence/studio_16m/windows_arm64/sharkbyte-85c74d14dcb54040a295e3c2fe422e53.json

      - name: Compare connected circuits with Qiskit and Cirq
        run: |
          python -B tools/run_connected_quantum_validation.py --backend qiskit --output connected-reference-results/qiskit.json --support-cap 65536 --memory-budget-mib 64 --timeout-seconds 60
          python -B tools/run_connected_quantum_validation.py --backend cirq --output connected-reference-results/cirq.json --support-cap 65536 --memory-budget-mib 64 --timeout-seconds 60
          python -B tools/compare_connected_quantum_receipts.py connected-reference-results/qiskit.json connected-reference-results/cirq.json --output connected-reference-results/qiskit-cirq-comparison.json

      - name: Upload connected-circuit receipts and statevectors
        uses: actions/upload-artifact@v4
        with:
          name: connected-statevector-${{ matrix.os }}-python-${{ matrix.python }}
          path: connected-reference-results/
          if-no-files-found: error

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install numerical test dependency
        run: python -m pip install numpy==2.3.5

      - name: Replay archived adaptive CLI receipts
        run: |
          python -B tools/verify_adaptive_cli_acceptance.py --receipt-dir evidence/adaptive-cli-cross-platform-20261118/windows-arm64 --output adaptive-cli-windows-replay-ci.json
          python -B tools/verify_adaptive_cli_acceptance.py --receipt-dir evidence/adaptive-cli-cross-platform-20261118/ubuntu-wsl2-arm64 --output adaptive-cli-ubuntu-replay-ci.json

      - name: Isolated install + acceptance regressions
        run: python tools/ci_acceptance.py

      - name: Unit test suite
        run: python -m unittest discover -s tests -v

      - name: Verify phase-flip recovery and negative controls
        run: python -B tools/phase_flip_recovery_cases.py > phase-flip-recovery-ci.json

      - name: Upload phase-flip recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-flip-recovery-${{ matrix.os }}-python-${{ matrix.python }}
          path: phase-flip-recovery-ci.json
          if-no-files-found: error

      - name: Verify rotation gates (normal)
        run: python -B tools/rotation_gate_evidence.py > rotation-gates-normal.json

      - name: Verify rotation gates (-O)
        run: python -O -B tools/rotation_gate_evidence.py > rotation-gates-O.json

      - name: Verify rotation gates (-OO)
        run: python -OO -B tools/rotation_gate_evidence.py > rotation-gates-OO.json

      - name: Upload rotation-gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: rotation-gates-${{ matrix.os }}-python-${{ matrix.python }}
          path: |
            rotation-gates-normal.json
            rotation-gates-O.json
            rotation-gates-OO.json
          if-no-files-found: error

      - name: Verify Frontier30 source benchmarks
        run: python -B benchmarks/sb_quantum_benchmark/sb_end_to_end_bench.py > frontier30-ci.json

      - name: Upload Frontier30 results
        uses: actions/upload-artifact@v4
        with:
          name: frontier30-${{ matrix.os }}-python-${{ matrix.python }}
          path: frontier30-ci.json
          if-no-files-found: error

  backend-agreement:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
      - name: Check all three backends
        run: python3 -B benchmarks/backend_agreement/check_backend_agreement.py
      - name: Check execution budgets
        run: |
          set -o pipefail
          python3 -B benchmarks/backend_agreement/check_all_budgets.py | tee backend-budget-ci.txt
      - name: Upload backend evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-agreement-ubuntu-arm64
          path: |
            benchmarks/backend_agreement/backend-suite-*/results.json
            backend-budget-ci.txt
          if-no-files-found: warn
