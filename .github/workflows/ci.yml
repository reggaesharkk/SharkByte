name: SharkByte CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Isolated install + acceptance regressions
        run: python tools/ci_acceptance.py

      - name: Unit test suite
        run: python -m unittest discover -s tests -v
      - name: Verify Frontier30 source benchmarks
        run: python -B benchmarks/sb_quantum_benchmark/sb_end_to_end_bench.py > frontier30-ci.json

      - name: Upload Frontier30 results
        uses: actions/upload-artifact@v4
        with:
          name: frontier30-${{ matrix.os }}-python-${{ matrix.python }}
          path: frontier30-ci.json
          if-no-files-found: error
