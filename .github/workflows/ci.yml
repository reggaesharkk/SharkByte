name: SharkByte CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  connected-statevector-reference:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install pinned independent references
        run: |
          python -m pip install -r requirements-independent-quantum.txt cirq-core==1.7.0
          python -m pip check

      - name: Verify checked-in connected-circuit evidence
        run: python -B tools/verify_connected_circuit_evidence.py

      - name: Compare connected circuits with Qiskit and Cirq
        run: |
          python -B tools/run_connected_quantum_validation.py --backend qiskit --output connected-reference-results/qiskit.json --support-cap 65536 --memory-budget-mib 64 --timeout-seconds 60
          python -B tools/run_connected_quantum_validation.py --backend cirq --output connected-reference-results/cirq.json --support-cap 65536 --memory-budget-mib 64 --timeout-seconds 60
          python -B tools/compare_connected_quantum_receipts.py connected-reference-results/qiskit.json connected-reference-results/cirq.json --output connected-reference-results/qiskit-cirq-comparison.json

      - name: Upload connected-circuit receipts and statevectors
        uses: actions/upload-artifact@v4
        with:
          name: connected-statevector-${{ matrix.os }}-python-${{ matrix.python }}
          path: connected-reference-results/
          if-no-files-found: error

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Isolated install + acceptance regressions
        run: python tools/ci_acceptance.py

      - name: Unit test suite
        run: python -m unittest discover -s tests -v

      - name: Verify phase-flip recovery and negative controls
        run: python -B tools/phase_flip_recovery_cases.py > phase-flip-recovery-ci.json

      - name: Upload phase-flip recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-flip-recovery-${{ matrix.os }}-python-${{ matrix.python }}
          path: phase-flip-recovery-ci.json
          if-no-files-found: error

      - name: Verify Frontier30 source benchmarks
        run: python -B benchmarks/sb_quantum_benchmark/sb_end_to_end_bench.py > frontier30-ci.json

      - name: Upload Frontier30 results
        uses: actions/upload-artifact@v4
        with:
          name: frontier30-${{ matrix.os }}-python-${{ matrix.python }}
          path: frontier30-ci.json
          if-no-files-found: error

  backend-agreement:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
      - name: Check all three backends
        run: python3 -B benchmarks/backend_agreement/check_backend_agreement.py
      - name: Check execution budgets
        run: |
          set -o pipefail
          python3 -B benchmarks/backend_agreement/check_all_budgets.py | tee backend-budget-ci.txt
      - name: Upload backend evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-agreement-ubuntu-arm64
          path: |
            benchmarks/backend_agreement/backend-suite-*/results.json
            backend-budget-ci.txt
          if-no-files-found: warn
